name: Build Simple Calculator (Win+Lin)
on:
  push:
    branches:
      - main
      - qt-framework
    paths:
      - 'A8/Simple_Calculator/**/*'
  pull_request:
    branches:
      - main
    paths:
      - 'A8/Simple_Calculator/**/*'

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8'
          arch: 'win64_msvc2022_64'
          cache: 'true'

      - name: Build for Windows
        run: |
          cmake -S ./A8/Simple_Calculator/ -B ./A8/Simple_Calculator/build/ -DCMAKE_BUILD_TYPE=MinSizeRel
          cmake --build ./A8/Simple_Calculator/build/ --config MinSizeRel

      - name: Package (windeployqt)
        shell: pwsh
        run: |
          windeployqt --release --no-translations --compiler-runtime --qmldir ./A8/Simple_Calculator/ ./A8/Simple_Calculator/build/MinSizeRel/

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: Simple_Calculator_win64.exe
          path: ./A8/Simple_Calculator/build/MinSizeRel
